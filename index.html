    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* The #E5DED3 is a slightly darker "luxury tan" to ensure white text is visible if video fails */
        body { background-color: #F5F2ED; color: #333; overflow-x: hidden; }
        .serif { font-family: 'Playfair Display', serif; }
        .sans { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }
        
        .video-overlay { background: rgba(0, 0, 0, 0.3); }
        
        .video-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 10;
            background-color: #E5DED3; /* Fallback color while loading */
        }

        .hero-height {
            height: 100vh;
            height: 100svh;
        }
    </style>
</head>
